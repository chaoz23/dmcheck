name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  family-conformance:
    # Executes this repo's documented exit contract against its real CLI and
    # fails if SKILL.md's claims and the tool's behaviour disagree. The clause-7
    # acceptance test checks an agent can *invoke* this tool; this checks that
    # what SKILL.md promises is *true*. Every family member passed the former
    # while failing the latter.
    #
    # The gate and its waiver list are canonical in srdcheck and read from there
    # rather than copied, per FAMILY.md's pin-by-link rule. srdcheck is pinned by
    # SHA, matching the existing cross-repo convention: a new rule landing in
    # srdcheck must not turn this repo's CI red on an unrelated PR.
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: candidate
      - name: Check out pinned srdcheck (canonical gate + baseline)
        uses: actions/checkout@v5
        with:
          repository: chaoz23/srdcheck
          ref: 63a355b9bf7ef2051fe82bf7eca03ccfdcb6bd11
          path: srdcheck-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install so the gate probes the real console script
        run: pip install -e ./candidate
      - name: SKILL.md claims match the CLI
        run: |
          python srdcheck-src/scripts/family_conformance.py candidate \
            --baseline srdcheck-src/family-conformance-baseline.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build tooling
        # dmcheck remains dependency-free at runtime. These dependencies make
        # the test and artifact gates mandatory rather than silently skipped.
        run: python -m pip install --upgrade "setuptools>=77" wheel build pytest
      - name: Assert complete pytest collection
        run: python scripts/assert_test_collection.py
      - name: Complete test and artifact suite
        run: python -m pytest -q --strict-markers
      - name: Referee the fixture sessions
        run: |
          python -m dmcheck.cli run tests/fixtures/clean-session.jsonl --charter tests/fixtures/charter.json
          python -m dmcheck.cli run tests/fixtures/messy-session.jsonl --charter tests/fixtures/charter.json --ledger tests/fixtures/messy-ledger.jsonl || test $? -eq 1
