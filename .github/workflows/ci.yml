name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build tooling
        # dmcheck remains dependency-free at runtime. These dependencies make
        # the test and artifact gates mandatory rather than silently skipped.
        run: python -m pip install --upgrade "setuptools>=77" wheel build pytest
      - name: Assert complete pytest collection
        run: python scripts/assert_test_collection.py
      - name: Complete test and artifact suite
        run: python -m pytest -q --strict-markers
      - name: Referee the fixture sessions
        run: |
          python -m dmcheck.cli run tests/fixtures/clean-session.jsonl --charter tests/fixtures/charter.json
          python -m dmcheck.cli run tests/fixtures/messy-session.jsonl --charter tests/fixtures/charter.json --ledger tests/fixtures/messy-ledger.jsonl || test $? -eq 1
