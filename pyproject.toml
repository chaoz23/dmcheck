[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmcheck"
version = "0.5.5"
description = "Deterministic conduct verdicts for live tabletop sessions — CI for running a game. Findings cite the table charter; ambiguity is never promoted to a definite accusation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "chaoz23"}]
keywords = ["ttrpg", "dnd", "game-master", "lint", "agents", "mcp", "deterministic"]

[project.urls]
Homepage = "https://github.com/chaoz23/dmcheck"

[project.scripts]
dmcheck = "dmcheck.cli:main"
dmcheck-mcp = "dmcheck.mcp:main"

[tool.pytest.ini_options]
markers = [
    "slow: builds a wheel and installs it into a throwaway venv",
]

[tool.setuptools]
packages = ["dmcheck"]

[tool.setuptools.package-data]
# EVERY non-.py file dmcheck reads at runtime must be listed here, or it is
# absent from the wheel and installed users hit a missing file. dm_core.md was
# omitted in 0.5.1-0.5.4, so `dmcheck init --dm` raised FileNotFoundError for
# every installed user while working fine in a checkout.
# Asserted by tests/test_packaging.py.
dmcheck = [
    "default_charter.json",
    "charter.schema.json",
    "transcript.schema.json",
    "ledger.schema.json",
    "evaluation-result.schema.json",
    "dm_core.md",
]
